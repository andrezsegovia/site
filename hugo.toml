baseURL = 'https://andrezsc.com/'
title = 'Andrez Segovia'
copyright = 'Andrez Segovia'

theme = 'hugo-bearblog'

defaultContentLanguage = 'en'
languageCode = 'en-us'

summaryLength = 10

enableGitInfo = true

ignoreFiles = ['content/templates', 'content/.obsidian']

[frontmatter]
    # `Lastmod` (and thus the "Updated on" date) comes only from an explicit
    # `lastmod`/`modified` front matter field — never from Git or date fallbacks.
    lastmod = ['lastmod']

[markup]
    [markup.highlight]
        lineNos = true
        lineNumbersInTable = false
        noClasses = true
        style = 'github-dark'

[languages]
  [languages.en]
    title = "Andrez Segovia"
    languageName = "en-US 🇺🇸"
    LanguageCode = "en-US"
    contentDir = "content"

[params]
    [params.author]
        name = 'Andrez Segovia'
        email = "me@andrezsc.com"

[menus]
  [[menus.main]]
    name = 'Archive'
    pageRef = '/archive'
    weight = 2

  [[menus.main]]
    name = 'Bookmarks'
    pageRef = '/bookmarks'
    weight = 5

  [[menus.main]]
    name = 'Categories'
    pageRef = '/categories'
    weight = 11

[taxonomies]
  category = 'categories'

[[module.mounts]]
  source = 'static'
  target = 'static'

# RSS Configuration
[outputs]
  home = ['html', 'rss']
  section = ['html']
  taxonomy = ['html']
  term = ['html', 'rss']




