<style>
  :root {
    --width: 720px;
    --font-main: "Space Grotesk", -apple-system, BlinkMacSystemFont, sans-serif;
    --font-secondary: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-code: "JetBrains Mono", SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    --font-scale: 1em;

    --background-color: #0B1311;
    --surface-color: #14221F;
    --surface-hover-color: #1E332E;
    --heading-color: #ECF3F1;
    --text-color: #ECF3F1;
    --muted-color: #7C938D;
    --link-color: #10B981;
    --accent-secondary: #F59E0B;
    --visited-color: #0E9F6E;
    --border-color: #1F332E;
    --code-background-color: #14221F;
    --code-color: #ECF3F1;
    --blockquote-color: #7C938D;
  }

  body {
    font-family: var(--font-secondary);
    font-size: var(--font-scale);
    margin: auto;
    padding: 20px;
    max-width: var(--width);
    text-align: left;
    background-color: var(--background-color);
    word-wrap: break-word;
    overflow-wrap: break-word;
    line-height: 1.65;
    color: var(--text-color);
  }

  h1,
  h2,
  h3,
  h4,
  h5,
  h6 {
    font-family: var(--font-main);
    color: var(--heading-color);
  }

  a {
    color: var(--link-color);
    cursor: pointer;
    text-decoration: none;
  }

  a:hover {
    color: var(--link-color);
    text-decoration: underline;
  }

  strong,
  b {
    color: var(--heading-color);
  }

  button {
    margin: 0;
    cursor: pointer;
  }

  time {
    font-family: var(--font-code);
    font-style: normal;
    font-size: 15px;
    color: var(--muted-color);
  }

  main {
    line-height: 1.7;
  }

  table {
    width: 100%;
  }

  th,
  td {
    border: 1px solid var(--border-color);
    padding: 6px 10px;
  }

  hr {
    border: 0;
    border-top: 1px dashed var(--border-color);
  }

  img {
    max-width: 100%;
  }

  pre {
    font-family: var(--font-code);
  }

  code {
    font-family: var(--font-code);
    padding: 2px;
    background-color: var(--code-background-color);
    color: var(--code-color);
    border-radius: 3px;
  }

  blockquote {
    border-left: 1px solid var(--border-color);
    color: var(--blockquote-color);
    padding-left: 20px;
    font-style: italic;
  }

  footer {
    padding: 25px 0;
    text-align: center;
    color: var(--muted-color);
  }

  .title:hover {
    text-decoration: none;
  }

  .title h1 {
    font-size: 1.5em;
  }

  .inline {
    width: auto !important;
  }

  .highlight,
  .code {
    padding: 1px 15px;
    background-color: var(--code-background-color) !important;
    color: var(--code-color);
    border-radius: 3px;
    margin-block-start: 1em;
    margin-block-end: 1em;
    overflow-x: auto;
  }

  /* Chroma emits an inline background on the <pre>; force it onto the surface token. */
  pre {
    background-color: var(--code-background-color) !important;
  }

  /* blog post list */
  ul.blog-posts {
    list-style-type: none;
    padding: unset;
  }

  ul.blog-posts li {
    display: flex;
  }

  ul.blog-posts li span {
    flex: 0 0 130px;
  }

  ul.blog-posts li a:visited {
    color: var(--visited-color);
  }

</style>
